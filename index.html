<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Liou Li — Research Profile">
  <title>Liou Li — Research Profile</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #202832;
      --body: #45515e;
      --muted: #77818c;
      --line: #e5e9ed;
      --accent: #294c70;
      --accent-soft: #f2f6f9;
      --max: 1080px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 15px/1.75 Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .container { width: min(var(--max), calc(100% - 52px)); margin: 0 auto; }
    .site-header { border-bottom: 1px solid var(--line); background: #fff; }
    .header-inner {
      min-height: 78px; display: flex; align-items: center;
      justify-content: space-between; gap: 28px;
    }
    .site-name { color: var(--ink); font-size: 20px; font-weight: 600; letter-spacing: -.035em; }
    .nav { display: flex; align-items: center; gap: 27px; }
    .nav a { color: #596573; font-size: 13px; }
    .nav a:hover { color: var(--accent); }
    main { padding: 64px 0 100px; }
    .profile-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 76px; }
    .sidebar { padding-top: 5px; }
    .sidebar-name { margin: 0 0 7px; font-size: 23px; line-height: 1.3; font-weight: 600; letter-spacing: -.04em; }
    .sidebar-label { margin: 0; color: var(--muted); font-size: 13px; }
    .sidebar-rule { width: 38px; height: 2px; background: var(--accent); margin: 24px 0; }
    .sidebar-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .main-column { min-width: 0; }
    .page-title { margin: 0 0 10px; font-size: 31px; line-height: 1.25; font-weight: 600; letter-spacing: -.045em; }
    .page-intro { margin: 0; max-width: 680px; color: var(--body); font-size: 15px; }
    .section { margin-top: 55px; }
    .section-heading {
      margin: 0 0 17px; padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--ink); font-size: 19px; font-weight: 600; letter-spacing: -.025em;
    }
    .empty { margin: 0; color: var(--muted); font-size: 13px; }
    .entry-list { list-style: none; padding: 0; margin: 0; }
    .entry-list li { padding: 13px 0; border-bottom: 1px solid #eef0f2; }
    .entry-list li:last-child { border-bottom: 0; }
    .section:target .section-heading { color: var(--accent); }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .footer-inner { min-height: 65px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    @media (max-width: 700px) {
      .container { width: min(100% - 36px, var(--max)); }
      .header-inner { min-height: 0; padding: 18px 0 13px; align-items: flex-start; flex-direction: column; gap: 13px; }
      .nav { width: 100%; gap: 21px; overflow-x: auto; padding-bottom: 2px; }
      .nav a { white-space: nowrap; font-size: 12px; }
      main { padding: 43px 0 72px; }
      .profile-layout { grid-template-columns: 1fr; gap: 35px; }
      .sidebar { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
      .sidebar-rule { margin: 15px 0; }
      .section { margin-top: 43px; }
      .page-title { font-size: 28px; }
      .footer-inner { min-height: 58px; align-items: flex-start; justify-content: center; flex-direction: column; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="#top">Liou Li</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#projects">Projects</a>
      </nav>
    </div>
  </header>

  <main class="container" id="top">
    <div class="profile-layout">
      <aside class="sidebar" aria-label="Profile">
        <h1 class="sidebar-name">Liou Li</h1>
        <p class="sidebar-label">Research Profile</p>
        <div class="sidebar-rule"></div>
        <p class="sidebar-note">Academic profile</p>
      </aside>

      <div class="main-column">
        <h2 class="page-title">Research Profile</h2>
        <p class="page-intro">A research profile and record of academic work.</p>

        <section class="section" id="research">
          <h3 class="section-heading">Research</h3>
          <p class="empty">Research information has not been added.</p>
        </section>

        <section class="section" id="publications">
          <h3 class="section-heading">Publications</h3>
          <p class="empty">No publications listed.</p>
        </section>

        <section class="section" id="projects">
          <h3 class="section-heading">Projects</h3>
          <p class="empty">No projects listed.</p>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <span>Liou Li</span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>
</body>
</html>
